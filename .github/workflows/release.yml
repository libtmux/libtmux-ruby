name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: rubygems-release
  cancel-in-progress: false

env:
  BUNDLE_FROZEN: 'true'
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  # The tagged commit runs the whole table itself, so the release does not
  # depend on a push having run it.
  compatibility:
    name: Compatibility
    permissions:
      contents: read
    uses: ./.github/workflows/compatibility.yml
    with:
      scope: full

  prepare:
    name: Validate and retain artifacts
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Require compatibility for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec scripts/release-ci check "$RELEASE_COMMIT"
      - name: Restore artifacts on a workflow retry
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec scripts/release-ci restore pkg/release
      - name: Install consumer test prerequisites
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: 'true'
          args: install --yes tmux zsh
      - name: Validate the complete installed artifact set
        run: bundle exec rake release:dry_run
      - name: Retain the exact files before any upload
        if: steps.restore.outputs.retained != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rubygems-release
          path: pkg/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish gems
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rubygems-release
          path: pkg/release
      - name: Verify the retained files before requesting credentials
        run: bundle exec rake release:verify
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish core, Async, MCP and workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec rake release:publish

  github_release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rubygems-release
          path: pkg/release
      - name: Attach the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec rake release:github
