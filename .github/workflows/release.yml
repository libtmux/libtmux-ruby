name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: rubygems-release
  cancel-in-progress: false

env:
  BUNDLE_FROZEN: 'true'
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    name: Validate and retain artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Require compatibility for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec scripts/release-ci "$RELEASE_COMMIT"
      - name: Restore artifacts on a workflow retry
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "rubygems-release") | .id')
          if [ -n "$artifact_id" ]; then
            gh run download "$GITHUB_RUN_ID" --name rubygems-release --dir pkg/release
            echo 'retained=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            previous_upload=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Publish gems") | .steps[]? | select(.name == "Publish core, Async, MCP and workspace" and .conclusion != "skipped") | .number')
            if [ -n "$previous_upload" ]; then
              echo 'Release artifacts are missing after publication was attempted; recover the original files.' >&2
              exit 1
            fi
          fi
      - name: Install consumer test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux zsh
      - name: Validate the complete installed artifact set
        run: bundle exec rake release:dry_run
      - name: Retain the exact files before any upload
        if: steps.restore.outputs.retained != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygems-release
          path: pkg/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish gems
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygems-release
          path: pkg/release
      - name: Verify the retained files before requesting credentials
        run: bundle exec rake release:verify
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish core, Async, MCP and workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec rake release:publish

  github_release:
    name: Create GitHub prerelease
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygems-release
          path: pkg/release
      - name: Attach the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec rake release:github
