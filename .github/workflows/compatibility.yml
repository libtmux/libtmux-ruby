name: compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_artifacts:
    name: Release artifacts (no publishing)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install consumer test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux zsh
      - name: Build and test the prospective release without credentials
        shell: bash
        run: |
          version=$(ruby -r ./gems/libtmux/lib/libtmux/version -e 'print LibTmux::VERSION')
          bundle exec rake "release:dry_run[v$version]"

  cell:
    name: ${{ matrix.platform.system }} / Ruby ${{ matrix.ruby }} / tmux ${{ matrix.tmux }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [{system: linux, runner: ubuntu-24.04}]
        ruby: ['3.3.12', '3.4.10', '4.0.7']
        tmux: ['3.3a', '3.4', '3.5a', '3.6', '3.7c', '3.8']
    env:
      BUNDLE_FROZEN: 'true'
      LIBTMUX_VERSION_CHECK_EXPECT: supported
      TMUX_VERSION: ${{ matrix.tmux }}
      RUBY_VERSION: ${{ matrix.ruby }}
      MATRIX_SYSTEM: ${{ matrix.platform.system }}
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses-dev bison pkg-config zsh
      - name: Build the exact tmux release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tmux-$TMUX_VERSION.tar.gz"
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" \
            --output "$archive"
          ruby -r./scripts/ci_manifest -rdigest -e 'expected = CIManifest.sha256(CIManifest.load, ENV.fetch("TMUX_VERSION")); abort "tmux archive checksum mismatch" unless Digest::SHA256.file(ARGV.fetch(0)).hexdigest == expected' "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          configure_options=(--disable-utf8proc)
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/tmux-install" "${configure_options[@]}"
          make -j2
          make install
          test "$("$RUNNER_TEMP/tmux-install/bin/tmux" -V)" = "tmux $TMUX_VERSION"
      - name: Run the complete cell
        timeout-minutes: 5
        run: >-
          bundle exec scripts/matrix
          --cell "$MATRIX_SYSTEM/$RUBY_VERSION/$TMUX_VERSION"
          --ruby "$RUBY_VERSION=$(ruby -e 'print Gem.ruby')"
          --tmux "$TMUX_VERSION=$RUNNER_TEMP/tmux-install/bin/tmux"
          --output build/matrix
      - name: Retain the cell report and failure output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.platform.system }}-${{ matrix.ruby }}-${{ matrix.tmux }}
          path: build/matrix/
          if-no-files-found: warn

  unsupported:
    name: Refuse tmux ${{ matrix.tmux }} before effects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.0a', '3.1c', '3.2a', '3.3']
    env:
      BUNDLE_FROZEN: 'true'
      TMUX_VERSION: ${{ matrix.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install native build dependencies and supported client
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux libevent-dev libncurses-dev bison pkg-config
      - name: Build the unsupported daemon
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tmux-$TMUX_VERSION.tar.gz"
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" \
            --output "$archive"
          expected=$(ruby -r./scripts/ci_manifest -e 'print CIManifest.sha256(CIManifest.load, ENV.fetch("TMUX_VERSION"))')
          echo "$expected  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/unsupported-tmux"
          make -j2
          make install
      - name: Exercise native refusal through a supported client
        env:
          LIBTMUX_VERSION_CHECK_CLIENT_TMUX: /usr/bin/tmux
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/unsupported-tmux/bin/tmux
        run: |
          set -euo pipefail
          case "$TMUX_VERSION" in
            3.0a|3.1c)
              export LIBTMUX_VERSION_CHECK_EXPECT="$TMUX_VERSION"
              timeout 120 bundle exec ruby -Itest test/old_daemon/pre_3_2_refusal_test.rb ;;
            3.2a|3.3)
              export LIBTMUX_VERSION_CHECK_EXPECT=refused
              bundle exec ruby -Itest test/integration/tmux_version_check_test.rb ;;
            *)
              echo "no version-check test is assigned to tmux $TMUX_VERSION" >&2
              exit 1 ;;
          esac

  development:
    name: tmux development build (next-3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BUNDLE_FROZEN: 'true'
      LIBTMUX_VERSION_CHECK_EXPECT: supported
      TMUX_COMMIT: d68e56f130ba44d13ae5f1f353526c7ce604099f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses-dev bison pkg-config autoconf automake zsh
      - name: Build tmux master at a pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/tmux/tmux.git "$RUNNER_TEMP/tmux-master"
          cd "$RUNNER_TEMP/tmux-master"
          git checkout --quiet "$TMUX_COMMIT"
          sh autogen.sh
          ./configure --prefix="$RUNNER_TEMP/tmux-master-install" --disable-utf8proc
          make -j2
          make install
          "$RUNNER_TEMP/tmux-master-install/bin/tmux" -V | grep -E '^tmux next-'
          echo "$RUNNER_TEMP/tmux-master-install/bin" >> "$GITHUB_PATH"
      - name: Run the outer suite against the development build
        timeout-minutes: 10
        env:
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/tmux-master-install/bin/tmux
        run: bundle exec scripts/check outer

  report:
    name: All required cells
    if: ${{ always() }}
    needs: [cell, unsupported, development]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: matrix-*
          path: build/matrix-input
      - name: Require unsupported-daemon version checks
        if: ${{ needs.unsupported.result != 'success' }}
        run: exit 1
      - name: Require the tmux development build
        if: ${{ needs.development.result != 'success' }}
        run: exit 1
      - name: Reject missing, failed, skipped or stale cells
        if: always()
        run: scripts/matrix --merge build/matrix-input --require-all --output build/matrix
      - name: Retain the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-report
          path: build/matrix/matrix.json
          if-no-files-found: warn
