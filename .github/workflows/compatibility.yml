name: compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest supported tmux, full runs the whole
          table with the refusal jobs and the development build, custom runs
          the refs in tmux-ref. A release is bound to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6,master.
        type: string
        default: ''
      ruby:
        description: >-
          Comma-separated Ruby versions from scripts/ci-matrix.json, such as
          3.3.12,4.0.7. Empty runs every Ruby for the supported cells and the
          newest for the other jobs.
        type: string
        default: ''
      os:
        description: Runner image for the test jobs
        type: choice
        options: [ubuntu-24.04, ubuntu-latest, ubuntu-22.04]
        default: ubuntu-24.04
  workflow_call:
    inputs:
      scope:
        description: How much of the table to cover. Release passes full.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event_name }}-${{ inputs.scope && github.run_id || github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a run covers is decided here from scripts/ci-matrix.json and the
  # event, so no job below lists a version. A push and a pull request test the
  # oldest and newest supported tmux; a release and a dispatch with scope full
  # test the whole table.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      os: ${{ steps.plan.outputs.os }}
      release_artifacts: ${{ steps.plan.outputs.release_artifacts }}
      cells: ${{ steps.plan.outputs.cells }}
      run_cells: ${{ steps.plan.outputs.run_cells }}
      ids: ${{ steps.plan.outputs.ids }}
      unsupported: ${{ steps.plan.outputs.unsupported }}
      run_unsupported: ${{ steps.plan.outputs.run_unsupported }}
      development: ${{ steps.plan.outputs.development }}
      run_development: ${{ steps.plan.outputs.run_development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          RUBY: ${{ inputs.ruby }}
          IMAGE: ${{ inputs.os }}
        run: |
          ruby scripts/ci-plan plan \
            --event "$EVENT" \
            --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" \
            --ruby "$RUBY" \
            --os "$IMAGE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  release_artifacts:
    name: Release artifacts (no publishing)
    needs: plan
    if: needs.plan.outputs.release_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install consumer test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux zsh
      - name: Build and test the prospective release without credentials
        shell: bash
        run: |
          version=$(ruby -r ./gems/libtmux/lib/libtmux/version -e 'print LibTmux::VERSION')
          bundle exec rake "release:dry_run[v$version]"

  cell:
    name: ${{ matrix.system }} / Ruby ${{ matrix.ruby }} / tmux ${{ matrix.tmux }}
    needs: plan
    if: needs.plan.outputs.run_cells == 'true'
    runs-on: ${{ needs.plan.outputs.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The plan chooses the cells and never leaves this empty when it runs.
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      BUNDLE_FROZEN: 'true'
      LIBTMUX_VERSION_CHECK_EXPECT: supported
      TMUX_VERSION: ${{ matrix.tmux }}
      TMUX_SHA256: ${{ matrix.sha256 }}
      RUBY_VERSION: ${{ matrix.ruby }}
      MATRIX_SYSTEM: ${{ matrix.system }}
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses-dev bison pkg-config zsh
      - name: Build the exact tmux release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tmux-$TMUX_VERSION.tar.gz"
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" \
            --output "$archive"
          echo "$TMUX_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          configure_options=(--disable-utf8proc)
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/tmux-install" "${configure_options[@]}"
          make -j2
          make install
          test "$("$RUNNER_TEMP/tmux-install/bin/tmux" -V)" = "tmux $TMUX_VERSION"
      - name: Run the complete cell
        timeout-minutes: 5
        run: >-
          bundle exec scripts/matrix
          --cell "$MATRIX_SYSTEM/$RUBY_VERSION/$TMUX_VERSION"
          --ruby "$RUBY_VERSION=$(ruby -e 'print Gem.ruby')"
          --tmux "$TMUX_VERSION=$RUNNER_TEMP/tmux-install/bin/tmux"
          --output build/matrix
      - name: Retain the cell report and failure output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.system }}-${{ matrix.ruby }}-${{ matrix.tmux }}
          path: build/matrix/
          if-no-files-found: warn

  unsupported:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_unsupported == 'true'
    runs-on: ${{ needs.plan.outputs.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unsupported) }}
    env:
      BUNDLE_FROZEN: 'true'
      TMUX_VERSION: ${{ matrix.tmux }}
      TMUX_SHA256: ${{ matrix.sha256 }}
      VERSION_CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install native build dependencies and supported client
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux libevent-dev libncurses-dev bison pkg-config
      - name: Build the unsupported daemon
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tmux-$TMUX_VERSION.tar.gz"
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" \
            --output "$archive"
          echo "$TMUX_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/unsupported-tmux"
          make -j2
          make install
      - name: Exercise native refusal through a supported client
        env:
          LIBTMUX_VERSION_CHECK_CLIENT_TMUX: /usr/bin/tmux
          LIBTMUX_TEST_TMUX: ${{ runner.temp }}/unsupported-tmux/bin/tmux
        run: |
          set -euo pipefail
          case "$VERSION_CHECK" in
            old_daemon)
              export LIBTMUX_VERSION_CHECK_EXPECT="$TMUX_VERSION"
              timeout 120 bundle exec ruby -Itest test/old_daemon/pre_3_2_refusal_test.rb ;;
            refused)
              export LIBTMUX_VERSION_CHECK_EXPECT=refused
              bundle exec ruby -Itest test/integration/tmux_version_check_test.rb ;;
            *)
              echo "no version-check test is assigned to tmux $TMUX_VERSION" >&2
              exit 1 ;;
          esac

  # The development build and any ref the manifest does not list: built from
  # source at a commit and run through the outer suite.
  development:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_development == 'true'
    runs-on: ${{ needs.plan.outputs.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.development) }}
    env:
      BUNDLE_FROZEN: 'true'
      LIBTMUX_VERSION_CHECK_EXPECT: supported
      TMUX_REF: ${{ matrix.ref }}
      EXPECT_VERSION: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libevent-dev libncurses-dev bison pkg-config autoconf automake zsh
      - name: Build tmux at the commit the ref names
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-tmux "$TMUX_REF" | tee "$RUNNER_TEMP/tmux-build.txt"
          binary="$(sed -n 's/^binary=//p' "$RUNNER_TEMP/tmux-build.txt")"
          if [ -n "$EXPECT_VERSION" ]; then
            "$binary" -V | grep -E "$EXPECT_VERSION"
          fi
          dirname "$binary" >> "$GITHUB_PATH"
          echo "LIBTMUX_TEST_TMUX=$binary" >> "$GITHUB_ENV"
      - name: Run the outer suite against the build
        timeout-minutes: 10
        run: bundle exec scripts/check outer

  # One check to require. A job the plan scheduled has to have succeeded and a
  # job it left out has to have been skipped, so a failure that skips its
  # dependents cannot pass. The cells must also have passed with evidence.
  report:
    name: All required cells
    if: ${{ always() }}
    needs: [plan, release_artifacts, cell, unsupported, development]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.run_cells == 'true' }}
        with:
          pattern: matrix-*
          path: build/matrix-input
      - name: Require every planned job
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ruby scripts/ci-plan verify
      - name: Reject missing, failed, skipped or stale cells
        if: ${{ always() && needs.plan.outputs.run_cells == 'true' }}
        env:
          CELLS: ${{ needs.plan.outputs.ids }}
        run: scripts/matrix --merge build/matrix-input --require-all --only "$CELLS" --output build/matrix
      - name: Retain the combined report
        if: ${{ always() && needs.plan.outputs.run_cells == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-report
          path: build/matrix/matrix.json
          if-no-files-found: warn
